<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyGuard - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card p-4 p-md-5 shadow-lg rounded-4 text-light">
        <div class="text-center mb-4">
            <div class="brand-icon mb-2">
                <i class="fa-solid fa-shield-halved fa-3x text-primary"></i>
            </div>
            <h2 class="fw-bold tracking-tight text-white">Honey<span class="text-primary">Guard</span></h2>
            <p class="text-muted small">Intrusion Detection & Auto-Response System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ category }} py-2 px-3 small rounded-3" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> {{ msg }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">ADMIN USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control bg-dark border-secondary text-light" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">ADMIN PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-light" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Access SOC Dashboard
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top border-secondary">
            <span class="badge bg-secondary-subtle text-secondary small">
                <i class="fa-solid fa-lock me-1"></i> Bound strictly to 127.0.0.1
            </span>
        </div>
    </div>
</body>
</html>
