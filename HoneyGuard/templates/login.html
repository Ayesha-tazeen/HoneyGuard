<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyGuard — Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card p-4 p-md-5 shadow-lg rounded-4">
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="fa-solid fa-shield-halved fa-3x" style="color:var(--accent-blue)"></i>
            </div>
            <h2 class="fw-bold" style="color:var(--text-primary)">
                Honey<span style="color:var(--accent-blue)">Guard</span>
            </h2>
            <p class="small" style="color:var(--text-muted)">Intrusion Detection &amp; Auto-Response System</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                <div class="alert alert-{{ category }} py-2 px-3 small rounded-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> {{ msg }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-uppercase" style="color:var(--text-label)">
                    Admin Username
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user" style="color:var(--text-label)"></i>
                    </span>
                    <input type="text" name="username" class="form-control"
                           placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-uppercase" style="color:var(--text-label)">
                    Admin Password
                </label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock" style="color:var(--text-label)"></i>
                    </span>
                    <input type="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Access SOC Dashboard
            </button>
        </form>

        <div class="text-center mt-4 pt-2" style="border-top:1px solid var(--border-color)">
            <span class="badge fs-8" style="background:rgba(100,116,139,0.2);color:var(--text-label)">
                <i class="fa-solid fa-shield-halved me-1"></i>HoneyGuard v2.0 — SOC Edition
            </span>
        </div>
    </div>
</body>
</html>
